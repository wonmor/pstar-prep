<text x="300" y="356" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">Do not climb or descend to avoid: alter heading to the right (CARs 602.19).</text>
