<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img">
<title>The readability scale</title>
<text x="20" y="20" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">READABILITY SCALE FOR RADIO CHECKS</text>
<rect x="40" y="174" width="88" height="36" rx="3" fill="#9B3A2B" stroke="#231F1A" stroke-width="1.5"/>
<text x="84" y="164" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#231F1A">1</text>
<text x="84" y="232" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F1A">Unreadable</text>
<text x="84" y="262" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E" letter-spacing="1">BAD</text>
<rect x="148" y="144" width="88" height="66" rx="3" fill="#9B3A2B" stroke="#231F1A" stroke-width="1.5"/>
<text x="192" y="134" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#231F1A">2</text>
<text x="192" y="232" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F1A">Readable now</text>
<text x="192" y="245" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F1A">and then</text>
<text x="192" y="262" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E" letter-spacing="1">POOR</text>
<rect x="256" y="114" width="88" height="96" rx="3" fill="#C9972E" stroke="#231F1A" stroke-width="1.5"/>
<text x="300" y="104" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#231F1A">3</text>
<text x="300" y="232" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F1A">Readable with</text>
<text x="300" y="245" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F1A">difficulty</text>
<text x="300" y="262" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E" letter-spacing="1">FAIR</text>
<rect x="364" y="84" width="88" height="126" rx="3" fill="#2E4B70" stroke="#231F1A" stroke-width="1.5"/>
<text x="408" y="74" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#231F1A">4</text>
<text x="408" y="232" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F1A">Readable</text>
<text x="408" y="262" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E" letter-spacing="1">GOOD</text>
<rect x="472" y="54" width="88" height="156" rx="3" fill="#2E4B70" stroke="#231F1A" stroke-width="1.5"/>
<text x="516" y="44" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#231F1A">5</text>
<text x="516" y="232" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F1A">Perfectly readable</text>
<text x="516" y="262" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E" letter-spacing="1">EXCELLENT</text>
<line x1="40" y1="210" x2="580" y2="210" stroke="#231F1A" stroke-width="2" stroke-linecap="round"/>
<text x="300" y="296" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F1A">A radio check transmission lasts no more than 10 seconds. A check made before departure is a preflight check.</text>
<text x="300" y="314" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">"Readability three" means your transmissions are readable with difficulty.</text>
</svg>
