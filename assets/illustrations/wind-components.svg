<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>Headwind and crosswind components</title>
<text x="20" y="20" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">WIND 300 DEGREES AT 20 KT, LANDING RUNWAY 27 (30 DEGREES OFF)</text>
<rect x="60" y="190" width="360" height="36" rx="0" fill="#625A4E" stroke="#625A4E" stroke-width="1.5"/>
<line x1="80" y1="208" x2="400" y2="208" stroke="#FBF6EA" stroke-width="2" stroke-linecap="butt" stroke-dasharray="10 10"/>
<g transform="translate(395 208) rotate(-90)"><text x="0" y="6" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#FBF6EA">27</text></g>
<g transform="translate(300 208) rotate(-90) scale(0.8)"><path d="M0 -22 C3 -22 4.5 -16 4.5 -8 L4.5 -4 L26 6 L26 10 L4.5 6 L3.5 14 L10 19 L10 22 L0 20 L-10 22 L-10 19 L-3.5 14 L-4.5 6 L-26 10 L-26 6 L-4.5 -4 L-4.5 -8 C-4.5 -16 -3 -22 0 -22 Z" fill="#FBF6EA"/></g>
<text x="240" y="246" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">runway heading 270</text>
<line x1="150" y1="50" x2="316.8" y2="146.4" stroke="#231F1A" stroke-width="3" stroke-linecap="round"/><polygon points="323,150 311,149.1 316.3,140.1" fill="#231F1A"/>
<g transform="translate(210 106) rotate(30)"><text x="0" y="0" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="900" fill="#231F1A">WIND 300 / 20 kt</text></g>
<line x1="150" y1="50" x2="317.6" y2="50" stroke="#2E4B70" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><polygon points="323,50 314.9,53.9 314.9,46.1" fill="#2E4B70"/>
<text x="236.5" y="42" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2E4B70">headwind 17 kt (20 x cos 30)</text>
<line x1="323" y1="50" x2="323" y2="144.6" stroke="#9B3A2B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><polygon points="323,150 319.1,141.9 326.9,141.9" fill="#9B3A2B"/>
<text x="331" y="104" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9B3A2B">crosswind 10 kt</text>
<text x="331" y="117" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#625A4E">20 x sin 30</text>
<text x="331" y="129" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#625A4E">from the right</text>
<path d="M190 50 A40 40 0 0 1 184.6 70" fill="none" stroke="#625A4E" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="74" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#625A4E">30°</text>
<text x="440" y="60" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">RULE OF THUMB</text>
<rect x="440" y="72" width="140" height="26" rx="3" fill="#E9E0CB" stroke="#CFC4AB" stroke-width="1"/>
<text x="452" y="90" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#231F1A">30° off</text>
<text x="568" y="90" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="end" fill="#9B3A2B">1/2 of wind</text>
<rect x="440" y="102" width="140" height="26" rx="3" fill="#FBF6EA" stroke="#CFC4AB" stroke-width="1"/>
<text x="452" y="120" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#231F1A">45° off</text>
<text x="568" y="120" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="end" fill="#9B3A2B">0.7 of wind</text>
<rect x="440" y="132" width="140" height="26" rx="3" fill="#E9E0CB" stroke="#CFC4AB" stroke-width="1"/>
<text x="452" y="150" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#231F1A">60° off</text>
<text x="568" y="150" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="end" fill="#9B3A2B">0.9 of wind</text>
<rect x="440" y="162" width="140" height="26" rx="3" fill="#FBF6EA" stroke="#CFC4AB" stroke-width="1"/>
<text x="452" y="180" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#231F1A">90° off</text>
<text x="568" y="180" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="end" fill="#9B3A2B">all of wind</text>
<text x="510" y="210" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">is crosswind</text>
<text x="300" y="290" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F1A">Crosswind beyond your limit? Overshoot and request an into-wind runway.</text>
<text x="300" y="350" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">crosswind = wind speed x sine of the angle between wind and runway; headwind uses the cosine.</text>
</svg>
