<text x="24" y="336" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#231F1A">Cloud heights are hundreds of feet AGL; the lowest BKN or OVC layer is the ceiling.</text>
<text x="24" y="350" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#231F1A">Wind is true direction in degrees and speed in knots; G marks gusts.</text>
<text x="24" y="364" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#625A4E">OVC010 with 3SM in a control zone means a circuit flown 500 ft below the cloud base.</text>
