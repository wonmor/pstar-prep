<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>Traffic by the clock</title>
<text x="20" y="20" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">TRAFFIC BY THE CLOCK: 12 O'CLOCK IS YOUR NOSE</text>
<circle cx="200" cy="160" r="115" fill="#FBF6EA" stroke="#231F1A" stroke-width="2"/>
<text x="248.5" y="81" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#625A4E">1</text>
<line x1="254.5" y1="65.6" x2="257.5" y2="60.4" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<text x="284" y="116.5" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="900" text-anchor="middle" fill="#9B3A2B">2</text>
<line x1="294.4" y1="105.5" x2="299.6" y2="102.5" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<text x="297" y="165" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#625A4E">3</text>
<line x1="309" y1="160" x2="315" y2="160" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<text x="284" y="213.5" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#625A4E">4</text>
<line x1="294.4" y1="214.5" x2="299.6" y2="217.5" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<text x="248.5" y="249" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#625A4E">5</text>
<line x1="254.5" y1="254.4" x2="257.5" y2="259.6" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<text x="200" y="262" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#625A4E">6</text>
<line x1="200" y1="269" x2="200" y2="275" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<text x="151.5" y="249" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#625A4E">7</text>
<line x1="145.5" y1="254.4" x2="142.5" y2="259.6" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<text x="116" y="213.5" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#625A4E">8</text>
<line x1="105.6" y1="214.5" x2="100.4" y2="217.5" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<text x="103" y="165" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#625A4E">9</text>
<line x1="91" y1="160" x2="85" y2="160" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<text x="116" y="116.5" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#625A4E">10</text>
<line x1="105.6" y1="105.5" x2="100.4" y2="102.5" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<text x="151.5" y="81" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#625A4E">11</text>
<line x1="145.5" y1="65.6" x2="142.5" y2="60.4" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<text x="200" y="68" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#625A4E">12</text>
<line x1="200" y1="51" x2="200" y2="45" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/>
<g transform="translate(200 160) rotate(0) scale(1.1)"><path d="M0 -22 C3 -22 4.5 -16 4.5 -8 L4.5 -4 L26 6 L26 10 L4.5 6 L3.5 14 L10 19 L10 22 L0 20 L-10 22 L-10 19 L-3.5 14 L-4.5 6 L-26 10 L-26 6 L-4.5 -4 L-4.5 -8 C-4.5 -16 -3 -22 0 -22 Z" fill="#2E4B70"/></g>
<line x1="200" y1="160" x2="308.3" y2="97.5" stroke="#9B3A2B" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<g transform="translate(327.3 86.5) rotate(90) scale(0.8)"><path d="M0 -22 C3 -22 4.5 -16 4.5 -8 L4.5 -4 L26 6 L26 10 L4.5 6 L3.5 14 L10 19 L10 22 L0 20 L-10 22 L-10 19 L-3.5 14 L-4.5 6 L-26 10 L-26 6 L-4.5 -4 L-4.5 -8 C-4.5 -16 -3 -22 0 -22 Z" fill="#9B3A2B"/></g>
<path d="M200 100 A60 60 0 0 1 251.96152422706632 130" fill="none" stroke="#9B3A2B" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="222" y="94" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="900" fill="#9B3A2B">60°</text>
<text x="200" y="307" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">each hour = 30 degrees; 3 and 9 o'clock are abeam</text>
<text x="400" y="60" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">EXAMPLE</text>
<rect x="400" y="70" width="180" height="100" rx="4" fill="#E9E0CB" stroke="#CFC4AB" stroke-width="1"/>
<text x="410" y="92" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#231F1A">You: heading 270.</text>
<text x="410" y="110" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#231F1A">ATC: "Traffic 2 o'clock,</text>
<text x="410" y="124" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#231F1A">5 miles, eastbound."</text>
<text x="410" y="146" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9B3A2B">= 60 degrees right of the nose,</text>
<text x="410" y="160" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9B3A2B">altitude unknown.</text>
<text x="400" y="200" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#231F1A">Altitude is only known when</text>
<text x="400" y="214" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#231F1A">ATC states it. Reply with</text>
<text x="400" y="228" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#231F1A">"traffic in sight" or "negative</text>
<text x="400" y="242" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#231F1A">contact".</text>
<text x="300" y="346" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">TC AIM RAC: radar traffic information is given relative to your track, using the 12-hour clock.</text>
</svg>
