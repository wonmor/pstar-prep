<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>Circuit height under a low ceiling</title>
<defs><pattern id="cloudHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9C917B" stroke-width="1"/></pattern></defs>
<text x="20" y="20" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">LOW CEILING VS. NOTAM CIRCUIT HEIGHT</text>
<line x1="20" y1="300" x2="580" y2="300" stroke="#231F1A" stroke-width="2" stroke-linecap="round"/>
<rect x="200" y="294" width="200" height="6" rx="0" fill="#625A4E" stroke="#625A4E" stroke-width="1.5"/>
<text x="300" y="322" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#231F1A">Airport elevation 400 ft ASL</text>
<rect x="20" y="36" width="420" height="54" rx="0" fill="url(#cloudHatch)" stroke="#9C917B" stroke-width="1"/>
<path d="M230 88 C220.5 57.6 252.8 42.4 271.8 54.6 C283.2 15 325 12 336.4 45.4 C363 27.2 401 39.4 393.4 63.7 C423.8 63.7 427.6 85 420 88 Z" fill="#FBF6EA" stroke="#625A4E" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="28" y="52" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="900" fill="#231F1A">OVERCAST</text>
<text x="28" y="65" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#231F1A">base 1,000 ft AGL = 1,400 ft ASL</text>
<line x1="20" y1="69" x2="440" y2="69" stroke="#9B3A2B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="448" y="67" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#9B3A2B">NOTAM circuit 1,500 ft ASL</text>
<text x="448" y="79" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#9B3A2B">is in cloud: unusable</text>
<line x1="20" y1="195" x2="440" y2="195" stroke="#2E4B70" stroke-width="2.5" stroke-linecap="round"/>
<g transform="translate(400 193) rotate(0) scale(-1.1 1.1)"><path d="M-22 0 L10 0 C16 0 20 -2 22 -4 L16 -7 L-6 -7 L-4 -3 L-14 -3 L-18 -14 L-22 -14 Z" fill="#2E4B70"/><path d="M-6 -3 L4 -3 L8 1 L-2 1 Z" fill="#2E4B70"/></g>
<text x="30" y="187" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#2E4B70">Fly the circuit 500 ft below the base: 900 ft ASL (500 ft above the airport)</text>
<line x1="500" y1="90" x2="500" y2="195" stroke="#2E4B70" stroke-width="1" stroke-linecap="round"/><line x1="495" y1="90" x2="505" y2="90" stroke="#2E4B70" stroke-width="1" stroke-linecap="round"/><line x1="495" y1="195" x2="505" y2="195" stroke="#2E4B70" stroke-width="1" stroke-linecap="round"/><text x="522" y="142.5" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2E4B70">500 ft</text>
<line x1="548" y1="90" x2="548" y2="300" stroke="#625A4E" stroke-width="1" stroke-linecap="round"/><line x1="543" y1="90" x2="553" y2="90" stroke="#625A4E" stroke-width="1" stroke-linecap="round"/><line x1="543" y1="300" x2="553" y2="300" stroke="#625A4E" stroke-width="1" stroke-linecap="round"/>
<text x="556" y="195" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#625A4E">1,000 ft</text>
<text x="556" y="208" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="500" fill="#625A4E">ceiling</text>
<text x="300" y="352" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">Controlled airspace VFR: 500 ft vertically from cloud, visibility 3 miles (CARs 602.114).</text>
</svg>
