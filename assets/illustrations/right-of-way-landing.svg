<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>Two aircraft on approach: the lower one has the right of way</title>
<text x="20" y="28" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">TWO AIRCRAFT ON APPROACH</text>
<line x1="20" y1="300" x2="580" y2="300" stroke="#231F1A" stroke-width="2" stroke-linecap="round"/>
<rect x="400" y="292" width="170" height="8" rx="0" fill="#625A4E" stroke="#625A4E" stroke-width="1.5"/>
<text x="485" y="326" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#625A4E" letter-spacing="2">RUNWAY</text>
<line x1="60" y1="110" x2="408" y2="292" stroke="#CFC4AB" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<g transform="translate(300 236) rotate(25) scale(1.3 1.3)"><path d="M-22 0 L10 0 C16 0 20 -2 22 -4 L16 -7 L-6 -7 L-4 -3 L-14 -3 L-18 -14 L-22 -14 Z" fill="#2E4B70"/><path d="M-6 -3 L4 -3 L8 1 L-2 1 Z" fill="#2E4B70"/></g>
<rect x="240" y="258" width="130" height="26" rx="3" fill="#2E4B70" stroke="#2E4B70" stroke-width="1.5"/><text x="305" y="275" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FBF6EA" letter-spacing="1">RIGHT OF WAY</text>
<text x="305" y="299" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">lower, ahead</text>
<g transform="translate(120 148) rotate(25) scale(1.3 1.3)"><path d="M-22 0 L10 0 C16 0 20 -2 22 -4 L16 -7 L-6 -7 L-4 -3 L-14 -3 L-18 -14 L-22 -14 Z" fill="#9B3A2B"/><path d="M-6 -3 L4 -3 L8 1 L-2 1 Z" fill="#9B3A2B"/></g>
<rect x="50" y="170" width="130" height="26" rx="3" fill="#9B3A2B" stroke="#9B3A2B" stroke-width="1.5"/><text x="115" y="187" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#FBF6EA" letter-spacing="1">GIVES WAY</text>
<text x="115" y="212" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">higher, behind</text>
<text x="300" y="352" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">The lower aircraft may not use the rule to cut in front of, or overtake, another aircraft on final.</text>
</svg>
