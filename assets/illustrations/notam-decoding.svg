<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>Reading a NOTAM</title>
<text x="20" y="20" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">READING A NOTAM</text>
<rect x="24" y="34" width="340" height="196" rx="4" fill="#FBF6EA" stroke="#9C917B" stroke-width="1.5"/>
<text x="40" y="62" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#231F1A">V1234/25  NOTAMN</text>
<text x="40" y="92" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#231F1A">Q) CZYZ/QMRLC/IV/NBO/A/000/999/</text>
<text x="40" y="108" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#625A4E">   4302N08109W005</text>
<text x="40" y="138" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#231F1A">A) CYXU</text>
<text x="40" y="164" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#231F1A">B) 2511131400</text>
<text x="40" y="190" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9B3A2B">C) 2511152200 EST</text>
<text x="40" y="216" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#231F1A">E) RWY 09/27 CLSD</text>
<line x1="190" y1="58" x2="380" y2="50" stroke="#9C917B" stroke-width="1" stroke-linecap="round"/><circle cx="190" cy="58" r="2.5" fill="#9C917B" stroke="#9C917B" stroke-width="1.5"/><text x="386" y="54" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#231F1A">Type: N new, R replacing, C cancelling</text><text x="386" y="67" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#625A4E">NOTAMR replaces an earlier NOTAM</text>
<line x1="100" y1="134" x2="380" y2="110" stroke="#9C917B" stroke-width="1" stroke-linecap="round"/><circle cx="100" cy="134" r="2.5" fill="#9C917B" stroke="#9C917B" stroke-width="1.5"/><text x="386" y="114" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#231F1A">A) Location</text><text x="386" y="127" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#625A4E">aerodrome or FIR affected</text>
<line x1="150" y1="160" x2="380" y2="150" stroke="#9C917B" stroke-width="1" stroke-linecap="round"/><circle cx="150" cy="160" r="2.5" fill="#9C917B" stroke="#9C917B" stroke-width="1.5"/><text x="386" y="154" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#231F1A">B) Start, UTC</text><text x="386" y="167" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#625A4E">year month day hour minute</text>
<line x1="205" y1="186" x2="380" y2="190" stroke="#9C917B" stroke-width="1" stroke-linecap="round"/><circle cx="205" cy="186" r="2.5" fill="#9C917B" stroke="#9C917B" stroke-width="1.5"/><text x="386" y="194" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#9B3A2B">C) End, UTC</text><text x="386" y="207" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#625A4E">without EST: expires at this time</text>
<line x1="160" y1="212" x2="380" y2="222" stroke="#9C917B" stroke-width="1" stroke-linecap="round"/><circle cx="160" cy="212" r="2.5" fill="#9C917B" stroke="#9C917B" stroke-width="1.5"/><text x="386" y="226" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#231F1A">E) Plain text</text><text x="386" y="239" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#625A4E">runway 09/27 closed</text>
<rect x="24" y="256" width="556" height="60" rx="4" fill="#E9E0CB" stroke="#CFC4AB" stroke-width="1"/>
<text x="36" y="278" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="900" fill="#9B3A2B">EST = estimated end time.</text>
<text x="36" y="295" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#231F1A">The NOTAM stays valid until a replacing (NOTAMR) or cancelling (NOTAMC) NOTAM is issued.</text>
<text x="36" y="309" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#625A4E">PERM = permanent change, to be published in the AIP Canada supplements and CFS.</text>
<text x="300" y="346" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">NOTAMs are available from every Flight Information Centre (FIC) and the NAV CANADA NOTAM service.</text>
</svg>
