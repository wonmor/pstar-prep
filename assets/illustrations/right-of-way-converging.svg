<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>Converging: the aircraft with the other on its right gives way</title>
<text x="20" y="28" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">CONVERGING AT THE SAME ALTITUDE</text>
<line x1="145" y1="225" x2="285" y2="110" stroke="#CFC4AB" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 6"/>
<line x1="455" y1="225" x2="315" y2="110" stroke="#CFC4AB" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 6"/>
<circle cx="300" cy="98" r="5" fill="#9B3A2B" stroke="#9B3A2B" stroke-width="1.5"/>
<text x="300" y="86" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#9B3A2B">collision point</text>
<g transform="translate(145 225) rotate(50) scale(1.25)"><path d="M0 -22 C3 -22 4.5 -16 4.5 -8 L4.5 -4 L26 6 L26 10 L4.5 6 L3.5 14 L10 19 L10 22 L0 20 L-10 22 L-10 19 L-3.5 14 L-4.5 6 L-26 10 L-26 6 L-4.5 -4 L-4.5 -8 C-4.5 -16 -3 -22 0 -22 Z" fill="#9B3A2B"/></g>
<path d="M175 200 Q230 165 215 240" fill="none" stroke="#9B3A2B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="215,240 212.8,231.3 220.4,232.8" fill="#9B3A2B"/>
<rect x="70" y="275" width="150" height="30" rx="3" fill="#9B3A2B" stroke="#9B3A2B" stroke-width="1.5"/><text x="145" y="294.3" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FBF6EA" letter-spacing="1">GIVES WAY</text>
<text x="145" y="325" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">sees the other on its right</text>
<g transform="translate(455 225) rotate(-50) scale(1.25)"><path d="M0 -22 C3 -22 4.5 -16 4.5 -8 L4.5 -4 L26 6 L26 10 L4.5 6 L3.5 14 L10 19 L10 22 L0 20 L-10 22 L-10 19 L-3.5 14 L-4.5 6 L-26 10 L-26 6 L-4.5 -4 L-4.5 -8 C-4.5 -16 -3 -22 0 -22 Z" fill="#2E4B70"/></g>
<line x1="430" y1="195" x2="369.2" y2="145.4" stroke="#2E4B70" stroke-width="2.5" stroke-linecap="round"/><polygon points="365,142 373.8,144.1 368.8,150.2" fill="#2E4B70"/>
<rect x="380" y="275" width="150" height="30" rx="3" fill="#2E4B70" stroke="#2E4B70" stroke-width="1.5"/><text x="455" y="294.3" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FBF6EA" letter-spacing="1">RIGHT OF WAY</text>
<text x="455" y="325" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">the aircraft on the right</text>
<text x="300" y="352" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">CARs 602.19: the aircraft that has the other on its right shall give way.</text>
</svg>
