<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>Who gives way to whom</title>
<text x="20" y="28" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">WHO GIVES WAY TO WHOM (CARS 602.19)</text>
<rect x="20" y="48" width="470" height="50" rx="4" fill="#E9E0CB" stroke="#CFC4AB" stroke-width="1"/>
<text x="36" y="80" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="900" fill="#2E4B70">1</text>
<g transform="translate(100 77) scale(0.75)"><path d="M0 -26 C14 -26 20 -14 20 -4 C20 6 10 12 4 18 L4 22 L-4 22 L-4 18 C-10 12 -20 6 -20 -4 C-20 -14 -14 -26 0 -26 Z" fill="#231F1A"/><rect x="-5" y="24" width="10" height="7" fill="#231F1A"/></g>
<text x="160" y="71" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#231F1A">Balloons</text>
<text x="160" y="89" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#625A4E">have the right of way over everything</text>
<rect x="20" y="104" width="470" height="50" rx="4" fill="#FBF6EA" stroke="#CFC4AB" stroke-width="1"/>
<text x="36" y="136" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="900" fill="#625A4E">2</text>
<g transform="translate(100 129) rotate(0) scale(0.75)"><path d="M0 -14 C2 -14 2.5 -8 2.5 -3 L40 1 L40 3.5 L2.5 2 L2 12 L7 15 L7 17 L0 16 L-7 17 L-7 15 L-2 12 L-2.5 2 L-40 3.5 L-40 1 L-2.5 -3 C-2.5 -8 -2 -14 0 -14 Z" fill="#231F1A"/></g>
<text x="160" y="127" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#231F1A">Gliders</text>
<text x="160" y="145" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#625A4E">give way to balloons only</text>
<rect x="20" y="160" width="470" height="50" rx="4" fill="#FBF6EA" stroke="#CFC4AB" stroke-width="1"/>
<text x="36" y="192" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="900" fill="#625A4E">3</text>
<g transform="translate(100 185) scale(0.75)"><path d="M-28 0 C-28 -9 -12 -12 4 -12 C18 -12 28 -6 28 0 C28 6 18 12 4 12 C-12 12 -28 9 -28 0 Z" fill="#231F1A"/><path d="M-30 -10 L-20 -4 L-20 4 L-30 10 Z" fill="#231F1A"/><rect x="-6" y="11" width="14" height="5" fill="#231F1A"/></g>
<text x="160" y="183" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#231F1A">Airships</text>
<text x="160" y="201" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#625A4E">give way to gliders and balloons</text>
<rect x="20" y="216" width="470" height="50" rx="4" fill="#FBF6EA" stroke="#CFC4AB" stroke-width="1"/>
<text x="36" y="248" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="900" fill="#625A4E">4</text>
<g transform="translate(100 241) rotate(0) scale(0.75)"><path d="M0 -22 C3 -22 4.5 -16 4.5 -8 L4.5 -4 L26 6 L26 10 L4.5 6 L3.5 14 L10 19 L10 22 L0 20 L-10 22 L-10 19 L-3.5 14 L-4.5 6 L-26 10 L-26 6 L-4.5 -4 L-4.5 -8 C-4.5 -16 -3 -22 0 -22 Z" fill="#231F1A"/></g><line x1="100" y1="258" x2="100" y2="275" stroke="#231F1A" stroke-width="1.5" stroke-linecap="round"/><g transform="translate(100 285) rotate(0) scale(0.42)"><path d="M0 -14 C2 -14 2.5 -8 2.5 -3 L40 1 L40 3.5 L2.5 2 L2 12 L7 15 L7 17 L0 16 L-7 17 L-7 15 L-2 12 L-2.5 2 L-40 3.5 L-40 1 L-2.5 -3 C-2.5 -8 -2 -14 0 -14 Z" fill="#231F1A"/></g>
<text x="160" y="239" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#231F1A">Power-driven aircraft towing</text>
<text x="160" y="257" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#625A4E">give way to all three above</text>
<rect x="20" y="272" width="470" height="50" rx="4" fill="#FBF6EA" stroke="#CFC4AB" stroke-width="1"/>
<text x="36" y="304" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="900" fill="#625A4E">5</text>
<g transform="translate(78 297) rotate(0) scale(0.8)"><path d="M0 -22 C3 -22 4.5 -16 4.5 -8 L4.5 -4 L26 6 L26 10 L4.5 6 L3.5 14 L10 19 L10 22 L0 20 L-10 22 L-10 19 L-3.5 14 L-4.5 6 L-26 10 L-26 6 L-4.5 -4 L-4.5 -8 C-4.5 -16 -3 -22 0 -22 Z" fill="#231F1A"/></g><g transform="translate(126 297) rotate(0) scale(0.7)"><path d="M0 -12 C5 -12 7 -6 7 0 C7 6 5 10 2 10 L2 26 L5 26 L5 28 L-5 28 L-5 26 L-2 26 L-2 10 C-5 10 -7 6 -7 0 C-7 -6 -5 -12 0 -12 Z" fill="#231F1A"/><line x1="-20" y1="-20" x2="20" y2="20" stroke="#231F1A" stroke-width="2"/><line x1="20" y1="-20" x2="-20" y2="20" stroke="#231F1A" stroke-width="2"/></g>
<text x="160" y="295" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#231F1A">Power-driven heavier-than-air</text>
<text x="160" y="313" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#625A4E">aeroplanes and helicopters give way to all of the above</text>
<line x1="540" y1="314" x2="540" y2="62.4" stroke="#9B3A2B" stroke-width="3" stroke-linecap="round"/><polygon points="540,54 546.1,66.6 533.9,66.6" fill="#9B3A2B"/>
<g transform="translate(560 198) rotate(-90)"><text x="0" y="0" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#9B3A2B" letter-spacing="1.5">GIVES WAY TO EVERYTHING ABOVE</text></g>
<text x="300" y="350" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">Every power-driven aircraft also gives way to any aircraft seen to be towing.</text>
</svg>
