<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>Avoiding wake turbulence</title>
<text x="20" y="20" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">LANDING BEHIND A HEAVY AEROPLANE</text>
<line x1="20" y1="150" x2="580" y2="150" stroke="#231F1A" stroke-width="2" stroke-linecap="round"/>
<rect x="200" y="144" width="370" height="6" rx="0" fill="#625A4E" stroke="#625A4E" stroke-width="1.5"/>
<line x1="60" y1="48" x2="270" y2="148" stroke="#9B3A2B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
<g transform="translate(120 76) rotate(18) scale(1.6 1.6)"><path d="M-22 0 L10 0 C16 0 20 -2 22 -4 L16 -7 L-6 -7 L-4 -3 L-14 -3 L-18 -14 L-22 -14 Z" fill="#9B3A2B"/><path d="M-6 -3 L4 -3 L8 1 L-2 1 Z" fill="#9B3A2B"/></g>
<path d="M95 71 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 M86 71 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 " fill="none" stroke="#9B3A2B" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M135 97 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 M126 97 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 " fill="none" stroke="#9B3A2B" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M175 123 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 M166 123 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 " fill="none" stroke="#9B3A2B" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M215 149 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 M206 149 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 " fill="none" stroke="#9B3A2B" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="270" cy="148" r="4" fill="#9B3A2B" stroke="#9B3A2B" stroke-width="1.5"/>
<text x="270" y="170" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#9B3A2B">heavy's touchdown</text>
<text x="270" y="182" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">vortices stop here</text>
<line x1="60" y1="28" x2="430" y2="148" stroke="#2E4B70" stroke-width="2" stroke-linecap="round"/>
<g transform="translate(300 104) rotate(18) scale(1 1)"><path d="M-22 0 L10 0 C16 0 20 -2 22 -4 L16 -7 L-6 -7 L-4 -3 L-14 -3 L-18 -14 L-22 -14 Z" fill="#2E4B70"/><path d="M-6 -3 L4 -3 L8 1 L-2 1 Z" fill="#2E4B70"/></g>
<circle cx="430" cy="148" r="4" fill="#2E4B70" stroke="#2E4B70" stroke-width="1.5"/>
<text x="430" y="170" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#2E4B70">land beyond it</text>
<text x="430" y="182" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">stay at or above its approach path</text>
<text x="440" y="48" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#625A4E">vortices sink and drift downwind;</text>
<text x="440" y="60" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#625A4E">a light crosswind can hold one</text>
<text x="440" y="72" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#625A4E">over the runway</text>
<text x="20" y="212" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">DEPARTING BEHIND A HEAVY AEROPLANE</text>
<line x1="20" y1="330" x2="580" y2="330" stroke="#231F1A" stroke-width="2" stroke-linecap="round"/>
<rect x="30" y="324" width="380" height="6" rx="0" fill="#625A4E" stroke="#625A4E" stroke-width="1.5"/>
<circle cx="300" cy="328" r="4" fill="#9B3A2B" stroke="#9B3A2B" stroke-width="1.5"/>
<line x1="300" y1="328" x2="560" y2="236" stroke="#9B3A2B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
<g transform="translate(470 268) rotate(-18) scale(1.6 1.6)"><path d="M-22 0 L10 0 C16 0 20 -2 22 -4 L16 -7 L-6 -7 L-4 -3 L-14 -3 L-18 -14 L-22 -14 Z" fill="#9B3A2B"/><path d="M-6 -3 L4 -3 L8 1 L-2 1 Z" fill="#9B3A2B"/></g>
<path d="M330 313 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 M321 313 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 " fill="none" stroke="#9B3A2B" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M366 300 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 M357 300 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 " fill="none" stroke="#9B3A2B" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M402 287 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 M393 287 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 " fill="none" stroke="#9B3A2B" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M438 274 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 M429 274 a5 5 0 1 0 0 10 a3 3 0 1 0 0 -6 " fill="none" stroke="#9B3A2B" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300" y="346" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#9B3A2B">heavy's rotation point: vortices begin</text>
<circle cx="160" cy="328" r="4" fill="#2E4B70" stroke="#2E4B70" stroke-width="1.5"/>
<line x1="160" y1="328" x2="560" y2="214" stroke="#2E4B70" stroke-width="2" stroke-linecap="round"/>
<g transform="translate(330 280) rotate(-15) scale(1 1)"><path d="M-22 0 L10 0 C16 0 20 -2 22 -4 L16 -7 L-6 -7 L-4 -3 L-14 -3 L-18 -14 L-22 -14 Z" fill="#2E4B70"/><path d="M-6 -3 L4 -3 L8 1 L-2 1 Z" fill="#2E4B70"/></g>
<text x="160" y="346" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#2E4B70">rotate before it</text>
<text x="560" y="206" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="end" fill="#2E4B70">climb above and upwind of its path</text>
<text x="60" y="232" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#231F1A">Strongest: heavy, clean, slow.</text>
<text x="60" y="246" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#625A4E">Persist 5 min or more in still air.</text>
</svg>
