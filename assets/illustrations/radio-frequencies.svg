<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img">
<title>VHF frequencies to know</title>
<text x="20" y="20" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">AERONAUTICAL VHF BAND 118.0 TO 136.975 MHZ</text>
<rect x="40" y="220" width="520" height="20" rx="3" fill="#E9E0CB" stroke="#231F1A" stroke-width="1.5"/>
<line x1="40" y1="240" x2="40" y2="246" stroke="#231F1A" stroke-width="1" stroke-linecap="round"/>
<text x="40" y="260" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">118</text>
<line x1="94.8" y1="240" x2="94.8" y2="246" stroke="#231F1A" stroke-width="1" stroke-linecap="round"/>
<text x="94.8" y="260" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">120</text>
<line x1="149.6" y1="240" x2="149.6" y2="246" stroke="#231F1A" stroke-width="1" stroke-linecap="round"/>
<text x="149.6" y="260" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">122</text>
<line x1="204.4" y1="240" x2="204.4" y2="246" stroke="#231F1A" stroke-width="1" stroke-linecap="round"/>
<text x="204.4" y="260" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">124</text>
<line x1="259.2" y1="240" x2="259.2" y2="246" stroke="#231F1A" stroke-width="1" stroke-linecap="round"/>
<text x="259.2" y="260" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">126</text>
<line x1="314" y1="240" x2="314" y2="246" stroke="#231F1A" stroke-width="1" stroke-linecap="round"/>
<text x="314" y="260" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">128</text>
<line x1="368.9" y1="240" x2="368.9" y2="246" stroke="#231F1A" stroke-width="1" stroke-linecap="round"/>
<text x="368.9" y="260" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">130</text>
<line x1="423.7" y1="240" x2="423.7" y2="246" stroke="#231F1A" stroke-width="1" stroke-linecap="round"/>
<text x="423.7" y="260" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">132</text>
<line x1="478.5" y1="240" x2="478.5" y2="246" stroke="#231F1A" stroke-width="1" stroke-linecap="round"/>
<text x="478.5" y="260" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">134</text>
<line x1="533.3" y1="240" x2="533.3" y2="246" stroke="#231F1A" stroke-width="1" stroke-linecap="round"/>
<text x="533.3" y="260" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">136</text>
<rect x="149.1" y="220" width="44" height="20" rx="0" fill="#C9972E" stroke="#C9972E" stroke-width="1.5"/>
<line x1="149.1" y1="274" x2="193.1" y2="274" stroke="#C9972E" stroke-width="2" stroke-linecap="round"/>
<text x="171" y="292" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#231F1A">121.9825 to 123.5875: general aviation communications</text>
<line x1="135.9" y1="220" x2="135.9" y2="50" stroke="#9B3A2B" stroke-width="2" stroke-linecap="round"/><circle cx="135.9" cy="220" r="3.5" fill="#9B3A2B" stroke="#9B3A2B" stroke-width="1.5"/><text x="141.9" y="52" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="900" fill="#9B3A2B">121.5</text><text x="141.9" y="65" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#231F1A">Emergency</text><text x="141.9" y="77" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#625A4E">distress, ELTs</text>
<line x1="155.1" y1="220" x2="155.1" y2="95" stroke="#625A4E" stroke-width="2" stroke-linecap="round"/><circle cx="155.1" cy="220" r="3.5" fill="#625A4E" stroke="#625A4E" stroke-width="1.5"/><text x="161.1" y="97" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="900" fill="#625A4E">122.2</text><text x="161.1" y="110" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#231F1A">FIC (FISE)</text><text x="161.1" y="122" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#625A4E">flight information centre</text>
<line x1="171.5" y1="220" x2="171.5" y2="140" stroke="#625A4E" stroke-width="2" stroke-linecap="round"/><circle cx="171.5" cy="220" r="3.5" fill="#625A4E" stroke="#625A4E" stroke-width="1.5"/><text x="177.5" y="142" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="900" fill="#625A4E">122.8</text><text x="177.5" y="155" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#231F1A">UNICOM</text><text x="177.5" y="167" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#625A4E">private advisory</text>
<line x1="182.5" y1="220" x2="182.5" y2="185" stroke="#625A4E" stroke-width="2" stroke-linecap="round"/><circle cx="182.5" cy="220" r="3.5" fill="#625A4E" stroke="#625A4E" stroke-width="1.5"/><text x="188.5" y="187" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="900" fill="#625A4E">123.2</text><text x="188.5" y="200" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#231F1A">ATF default</text><text x="188.5" y="212" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#625A4E">where there is no UNICOM</text>
<line x1="278.4" y1="220" x2="278.4" y2="50" stroke="#2E4B70" stroke-width="2" stroke-linecap="round"/><circle cx="278.4" cy="220" r="3.5" fill="#2E4B70" stroke="#2E4B70" stroke-width="1.5"/><text x="284.4" y="52" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="900" fill="#2E4B70">126.7</text><text x="284.4" y="65" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#231F1A">En route VFR</text><text x="284.4" y="77" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#625A4E">uncontrolled airspace: broadcast and monitor</text>
<text x="300" y="316" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F1A">En route in uncontrolled airspace, monitor 126.7 and 121.5 when practical and not on an MF or ATF.</text>
<text x="300" y="334" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">ATC frequencies vary by unit (tower, ground, terminal): read them from the CFS. 243.0 MHz is the UHF emergency frequency.</text>
</svg>
