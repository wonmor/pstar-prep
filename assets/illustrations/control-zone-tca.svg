<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>Control zone and terminal control area</title>
<text x="20" y="20" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">CONTROL ZONE UNDER A TERMINAL CONTROL AREA (SIDE VIEW)</text>
<line x1="20" y1="300" x2="580" y2="300" stroke="#231F1A" stroke-width="2" stroke-linecap="round"/>
<rect x="110" y="60" width="380" height="60" rx="0" fill="#E9E0CB" stroke="#2E4B70" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="170" y="120" width="260" height="60" rx="0" fill="#E9E0CB" stroke="#2E4B70" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="300" y="84" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#2E4B70" letter-spacing="1">CLASS C TERMINAL CONTROL AREA</text>
<text x="300" y="100" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#231F1A">clearance required; establish and maintain two-way radio contact</text>
<text x="300" y="140" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">inverted wedding cake: wider as you go up</text>
<rect x="230" y="180" width="140" height="120" rx="0" fill="#FBF6EA" stroke="#2E4B70" stroke-width="2.5"/>
<text x="300" y="205" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="900" text-anchor="middle" fill="#2E4B70" letter-spacing="1">CONTROL ZONE</text>
<text x="300" y="222" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle" fill="#231F1A">surface to 3,000 ft AAE</text>
<text x="300" y="238" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle" fill="#231F1A">normally 5 NM radius</text>
<text x="300" y="258" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#625A4E">Special VFR only exists here</text>
<rect x="285" y="292" width="30" height="8" rx="0" fill="#231F1A" stroke="#231F1A" stroke-width="1.5"/>
<text x="300" y="318" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">tower</text>
<line x1="230" y1="170" x2="300" y2="170" stroke="#625A4E" stroke-width="1" stroke-linecap="round"/><line x1="230" y1="175" x2="230" y2="165" stroke="#625A4E" stroke-width="1" stroke-linecap="round"/><line x1="300" y1="175" x2="300" y2="165" stroke="#625A4E" stroke-width="1" stroke-linecap="round"/><text x="265" y="162" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#625A4E">5 NM</text>
<line x1="385" y1="180" x2="385" y2="300" stroke="#625A4E" stroke-width="1" stroke-linecap="round"/><line x1="380" y1="180" x2="390" y2="180" stroke="#625A4E" stroke-width="1" stroke-linecap="round"/><line x1="380" y1="300" x2="390" y2="300" stroke="#625A4E" stroke-width="1" stroke-linecap="round"/><text x="409" y="240" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#625A4E">3,000 ft</text>
<g transform="translate(70 236) rotate(0) scale(1.2 1.2)"><path d="M-22 0 L10 0 C16 0 20 -2 22 -4 L16 -7 L-6 -7 L-4 -3 L-14 -3 L-18 -14 L-22 -14 Z" fill="#9B3A2B"/><path d="M-6 -3 L4 -3 L8 1 L-2 1 Z" fill="#9B3A2B"/></g>
<line x1="100" y1="236" x2="194.6" y2="236" stroke="#9B3A2B" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><polygon points="200,236 191.9,239.9 191.9,232.1" fill="#9B3A2B"/>
<text x="20" y="262" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9B3A2B">Call the tower BEFORE</text>
<text x="20" y="276" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9B3A2B">entering the control zone</text>
<text x="20" y="290" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="500" fill="#625A4E">with ATIS, position, altitude, intentions</text>
<text x="440" y="236" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#231F1A">Crossing a Class C zone?</text>
<text x="440" y="250" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#625A4E">Advise ATC of your intentions</text>
<text x="440" y="263" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#625A4E">and obtain a clearance.</text>
<text x="300" y="346" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">CARs 101.01 and 601.08; TC AIM RAC: control zones, Class C airspace, arrival procedures.</text>
</svg>
