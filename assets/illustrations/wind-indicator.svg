<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>Reading a standard windsock</title>
<text x="20" y="28" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">STANDARD WIND DIRECTION INDICATOR (DRY)</text>
<line x1="20" y1="280" x2="580" y2="280" stroke="#231F1A" stroke-width="2" stroke-linecap="round"/>
<line x1="100" y1="280" x2="100" y2="100" stroke="#231F1A" stroke-width="3" stroke-linecap="round"/><path d="M113.86375296238198 108.05157658655908 L122.24091758679819 217.95527585485226 L108.3771646244162 219.9036992682932 L86.13624703761802 111.94842341344092 Z" fill="#FBF6EA" stroke="#231F1A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="100" cy="110" r="4" fill="#231F1A" stroke="#231F1A" stroke-width="1.5"/><text x="100" y="306" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#231F1A">Hanging</text><text x="100" y="324" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">calm</text>
<line x1="300" y1="280" x2="300" y2="100" stroke="#231F1A" stroke-width="3" stroke-linecap="round"/><path d="M308.99902653561156 99.27537779633431 L388.7644020108933 175.34432596368646 L379.7653754752818 186.06894816735218 L291.00097346438844 120.72462220366569 Z" fill="#C9972E" stroke="#231F1A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="300" cy="110" r="4" fill="#231F1A" stroke="#231F1A" stroke-width="1.5"/><text x="300" y="306" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#231F1A">Drooping</text><text x="300" y="324" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">less than 15 kt</text>
<line x1="470" y1="280" x2="470" y2="100" stroke="#231F1A" stroke-width="3" stroke-linecap="round"/><path d="M470 96 L580 103 L580 117 L470 124 Z" fill="#9B3A2B" stroke="#231F1A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="470" cy="110" r="4" fill="#231F1A" stroke="#231F1A" stroke-width="1.5"/><text x="470" y="306" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#231F1A">Horizontal</text><text x="470" y="324" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">15 kt or more</text>
<line x1="420" y1="60" x2="554.6" y2="60" stroke="#2E4B70" stroke-width="2.5" stroke-linecap="round"/><polygon points="560,60 551.9,63.9 551.9,56.1" fill="#2E4B70"/>
<text x="490" y="50" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#2E4B70" letter-spacing="2">WIND</text>
<text x="490" y="78" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">tail points downwind</text>
<text x="300" y="350" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">Take off and land toward the open end of the sock, into wind.</text>
</svg>
