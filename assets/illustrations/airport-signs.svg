<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>Airport signs</title>
<text x="20" y="28" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#625A4E" letter-spacing="1.5">AIRPORT SIGNS</text>
<rect x="30" y="70" width="160" height="90" rx="4" fill="#9B3A2B" stroke="#9B3A2B" stroke-width="1.5"/><text x="110" y="125" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#FBF6EA">04-22</text><text x="110" y="178" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#231F1A">Mandatory: runway holding position</text><text x="110" y="192" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">stop here unless cleared</text>
<rect x="220" y="70" width="110" height="90" rx="4" fill="#231F1A" stroke="#C9972E" stroke-width="4"/><text x="275" y="125" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#C9972E">A</text><text x="275" y="178" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#231F1A">Location</text><text x="275" y="192" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">the taxiway you are on</text>
<rect x="360" y="70" width="120" height="90" rx="4" fill="#C9972E" stroke="#C9972E" stroke-width="1.5"/><text x="420" y="125" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#231F1A">B →</text><text x="420" y="178" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#231F1A">Direction</text><text x="420" y="192" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">turn here for taxiway B</text>
<rect x="30" y="200" width="160" height="90" rx="4" fill="#9B3A2B" stroke="#9B3A2B" stroke-width="1.5"/><text x="110" y="240" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="#FBF6EA">NO</text><text x="110" y="270" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="#FBF6EA">ENTRY</text><text x="110" y="308" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#231F1A">Mandatory: no entry</text><text x="110" y="322" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">do not taxi in</text>
<rect x="360" y="200" width="170" height="90" rx="4" fill="#C9972E" stroke="#C9972E" stroke-width="1.5"/><text x="445" y="255" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#231F1A">APRON →</text><text x="445" y="308" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#231F1A">Destination</text><text x="445" y="322" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">route to the apron</text>
<text x="275" y="236" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#9B3A2B">Red + white</text>
<text x="275" y="252" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">never pass without</text>
<text x="275" y="264" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#625A4E">a clearance</text>
<text x="300" y="352" font-family="Jost, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#625A4E">Read back a hold short instruction in full: "Hold short of 04".</text>
</svg>
